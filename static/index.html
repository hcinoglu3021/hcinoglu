<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Organizer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f0;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #666;
      font-size: 0.95rem;
      margin-bottom: 40px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 20px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 680px;
    }

    /* Record button */
    .btn-record {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 auto;
      padding: 16px 36px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      background: #1a1a2e;
      color: #fff;
    }

    .btn-record:hover { background: #2d2d4e; }
    .btn-record:active { transform: scale(0.97); }
    .btn-record:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-record.recording {
      background: #e53935;
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(229,57,53,0.4); }
      50%       { box-shadow: 0 0 0 12px rgba(229,57,53,0); }
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .btn-record.recording .dot { background: #fff; }

    /* Timer */
    .timer {
      text-align: center;
      font-size: 0.9rem;
      color: #999;
      margin-top: 12px;
      height: 20px;
    }

    /* Status / spinner */
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #555;
      min-height: 28px;
    }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #ddd;
      border-top-color: #1a1a2e;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-msg {
      background: #fff3f3;
      border: 1px solid #fcc;
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 20px;
      font-size: 0.9rem;
      color: #c0392b;
      display: none;
    }

    /* Notes output */
    .notes-section {
      margin-top: 28px;
      display: none;
    }

    .notes-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .notes-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
    }

    .btn-copy {
      padding: 6px 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      font-size: 0.82rem;
      cursor: pointer;
      color: #444;
      transition: background 0.15s;
    }

    .btn-copy:hover { background: #f5f5f0; }

    .notes-body {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      line-height: 1.7;
      color: #222;
    }

    .notes-body h2 {
      font-size: 1.15rem;
      margin: 18px 0 6px;
      color: #1a1a2e;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    .notes-body h2:first-child { margin-top: 0; }

    .notes-body h3 {
      font-size: 1rem;
      margin: 14px 0 4px;
      color: #333;
    }

    .notes-body ul {
      padding-left: 20px;
      margin: 4px 0 10px;
    }

    .notes-body li { margin-bottom: 4px; }

    .notes-body strong { color: #1a1a2e; }

    .notes-body p { margin-bottom: 10px; }

    /* Record again link */
    .btn-again {
      display: block;
      margin: 20px auto 0;
      background: none;
      border: none;
      color: #0066cc;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .btn-again:hover { color: #004499; }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 24px 0;
      display: none;
    }
  </style>
</head>
<body>
  <h1>Voice Organizer</h1>
  <p class="subtitle">Speak your thoughts. Get structured notes.</p>

  <div class="card">
    <button class="btn-record" id="recordBtn">
      <span class="dot"></span>
      <span id="btnLabel">Start Recording</span>
    </button>

    <div class="timer" id="timer"></div>
    <div class="status" id="status"></div>
    <div class="error-msg" id="errorMsg"></div>

    <hr class="divider" id="divider">

    <div class="notes-section" id="notesSection">
      <div class="notes-header">
        <span class="notes-label">Organized Notes</span>
        <button class="btn-copy" id="copyBtn">Copy markdown</button>
      </div>
      <div class="notes-body" id="notesBody"></div>
    </div>

    <button class="btn-again" id="againBtn" style="display:none">Record again</button>
  </div>

  <script>
    // ── DOM refs ──────────────────────────────────────────────────────────────
    const recordBtn   = document.getElementById('recordBtn');
    const btnLabel    = document.getElementById('btnLabel');
    const timerEl     = document.getElementById('timer');
    const statusEl    = document.getElementById('status');
    const errorMsg    = document.getElementById('errorMsg');
    const divider     = document.getElementById('divider');
    const notesSection = document.getElementById('notesSection');
    const notesBody   = document.getElementById('notesBody');
    const copyBtn     = document.getElementById('copyBtn');
    const againBtn    = document.getElementById('againBtn');

    // ── State ─────────────────────────────────────────────────────────────────
    let mediaRecorder = null;
    let audioChunks   = [];
    let timerInterval = null;
    let slowTimeout   = null;
    let elapsedSec    = 0;
    let currentMarkdown = '';

    // ── Helpers ───────────────────────────────────────────────────────────────
    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function setStatus(html, showSpinner = false) {
      statusEl.innerHTML = showSpinner
        ? `<div class="spinner"></div><span>${html}</span>`
        : html;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      setStatus('');
    }

    function clearError() {
      errorMsg.textContent = '';
      errorMsg.style.display = 'none';
    }

    // ── Markdown → HTML renderer (covers what Claude produces) ────────────────
    function renderMarkdown(md) {
      // Escape HTML entities first
      let html = md
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Headings
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');

      // Bold
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      // Bullet lines → <li>
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');

      // Wrap consecutive <li> blocks in <ul>
      html = html.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, (match) => {
        return '<ul>' + match + '</ul>';
      });

      // Paragraphs: double newlines between non-tag lines
      const lines = html.split('\n');
      const parts = [];
      let para = [];
      for (const line of lines) {
        const trimmed = line.trim();
        if (trimmed === '') {
          if (para.length) { parts.push('<p>' + para.join(' ') + '</p>'); para = []; }
        } else if (/^<(h[23]|ul|li)/.test(trimmed)) {
          if (para.length) { parts.push('<p>' + para.join(' ') + '</p>'); para = []; }
          parts.push(trimmed);
        } else {
          para.push(trimmed);
        }
      }
      if (para.length) parts.push('<p>' + para.join(' ') + '</p>');

      return parts.join('\n');
    }

    // ── Recording ─────────────────────────────────────────────────────────────
    async function startRecording() {
      clearError();
      notesSection.style.display = 'none';
      divider.style.display      = 'none';
      againBtn.style.display     = 'none';

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        if (err.name === 'NotAllowedError') {
          showError('Microphone access denied. Check browser permissions and try again.');
        } else {
          showError('Could not access microphone: ' + err.message);
        }
        return;
      }

      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = handleRecordingStop;
      mediaRecorder.start(250); // flush every 250 ms

      // UI: recording state
      recordBtn.classList.add('recording');
      btnLabel.textContent = 'Stop Recording';
      setStatus('');
      timerEl.textContent = '00:00';
      elapsedSec = 0;
      timerInterval = setInterval(() => {
        elapsedSec++;
        timerEl.textContent = formatTime(elapsedSec);
      }, 1000);
    }

    function stopRecording() {
      clearInterval(timerInterval);
      timerEl.textContent = '';
      recordBtn.classList.remove('recording');
      recordBtn.disabled = true;
      btnLabel.textContent = 'Processing…';
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }

    async function handleRecordingStop() {
      setStatus('Transcribing audio…', true);

      const mimeType = mediaRecorder.mimeType;
      const ext = mimeType.includes('ogg') ? 'ogg'
                : mimeType.includes('mp4') ? 'mp4'
                : 'webm';
      const blob = new Blob(audioChunks, { type: mimeType });
      const formData = new FormData();
      formData.append('audio', blob, `recording.${ext}`);

      // Warn if taking a long time
      slowTimeout = setTimeout(() => {
        setStatus('Taking longer than usual — almost there…', true);
      }, 15000);

      try {
        const res = await fetch('/transcribe', { method: 'POST', body: formData });
        clearTimeout(slowTimeout);

        if (!res.ok) {
          const detail = await res.json().catch(() => ({}));
          showError('Server error: ' + (detail.detail || res.statusText));
          resetButton();
          return;
        }

        const data = await res.json();

        if (data.error === 'no_speech') {
          showError('No speech detected. Please try recording again.');
        } else if (data.error) {
          showError(data.error);
        } else {
          currentMarkdown = data.notes;
          notesBody.innerHTML = renderMarkdown(data.notes);
          divider.style.display      = 'block';
          notesSection.style.display = 'block';
          againBtn.style.display     = 'block';
        }
      } catch (err) {
        clearTimeout(slowTimeout);
        showError('Network error: ' + err.message);
      }

      setStatus('');
      resetButton();
    }

    function resetButton() {
      recordBtn.disabled = false;
      recordBtn.classList.remove('recording');
      btnLabel.textContent = 'Start Recording';
    }

    // ── Event listeners ───────────────────────────────────────────────────────
    recordBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        startRecording();
      }
    });

    againBtn.addEventListener('click', () => {
      notesSection.style.display = 'none';
      divider.style.display      = 'none';
      againBtn.style.display     = 'none';
      clearError();
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(currentMarkdown).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => { copyBtn.textContent = 'Copy markdown'; }, 1500);
      }).catch(() => {
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => { copyBtn.textContent = 'Copy markdown'; }, 1500);
      });
    });
  </script>
</body>
</html>
